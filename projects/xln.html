<style>

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]:active::-webkit-slider-thumb {
    background: transparent;
  }

  .draggable {
    transition: transform 0.2s, margin 0.2s;
    cursor: grab;
  }
  .draggable:active {
    cursor: grabbing;
  }
  .placeholder {
    width: 0px;
    height: 120px;
    margin: 0;
    background: transparent;
  }
</style>

<script>

  // Preset Macro

  const slider = document.getElementById('dynamic-slider');
  slider.addEventListener('input', (event) => {
    const value = event.target.value;
    const thumbWidth = 20 + (value / 5); // Increase thumb width based on value
    event.target.style.setProperty('--thumb-width', `${thumbWidth}px`);
    event.target.style.background = `linear-gradient(to right, #ACBBD2 ${value}%, #1C1C26 ${value}%)`;
  });

  // Signal Chain

  const cluster = document.getElementById('image-cluster');
  let draggedElement = null;
  let placeholder = null;

  cluster.addEventListener('dragstart', (e) => {
    if (e.target.classList.contains('draggable')) {
      draggedElement = e.target;
      placeholder = document.createElement('div');
      placeholder.classList.add('placeholder');
      draggedElement.style.opacity = '0.2';
      e.dataTransfer.effectAllowed = 'move';
    }
  });

  cluster.addEventListener('dragend', (e) => {
    if (draggedElement) {
      draggedElement.style.opacity = '1';
      placeholder.remove();
      draggedElement = null;
      placeholder = null;
    }
  });

  cluster.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (placeholder && e.target.classList.contains('draggable') && e.target !== draggedElement) {
      const rect = e.target.getBoundingClientRect();
      const next = e.clientX > rect.left + rect.width / 2;
      cluster.insertBefore(placeholder, next ? e.target.nextSibling : e.target);
    }
  });

  cluster.addEventListener('drop', (e) => {
    e.preventDefault();
    if (draggedElement && placeholder) {
      cluster.insertBefore(draggedElement, placeholder);
    }
  });



  // Hover Area Functionality
  const macroHover = document.getElementById('macro-hover');
  const macroText = document.getElementById('macro-text');

  macroHover.addEventListener('mouseenter', () => {
    macroText.style.display = 'block';
  });

  macroHover.addEventListener('mouseleave', () => {
    macroText.style.display = 'none';
  });



  const harmonicHover = document.getElementById('harmonic-hover');
  const harmonicText = document.getElementById('harmonic-text');

  harmonicHover.addEventListener('mouseenter', () => {
    harmonicText.style.display = 'block';
  });

  harmonicHover.addEventListener('mouseleave', () => {
    harmonicText.style.display = 'none';
  });
</script>
